<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>API 用量</title>
  <style>
    :root {
      --bg-1: #fafbfd;
      --bg-2: #f1f4f9;
      --ink: #1c2333;
      --dim: #6b748c;
      --faint: #9aa3bb;
      --card: #ffffff;
      --border: rgba(15, 23, 42, 0.06);
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.04);
      --accent: #ff8a3d;
      --hover: rgba(15, 23, 42, 0.04);
      --active: rgba(15, 23, 42, 0.08);
      --menu-bg: rgba(255, 255, 255, 0.78);
      --tip-bg: rgba(28, 35, 51, 0.92);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-1: #14161f;
        --bg-2: #0f1118;
        --ink: #e7eaf3;
        --dim: #a6adc4;
        --faint: #6f7690;
        --card: #1c1f2b;
        --border: rgba(255, 255, 255, 0.08);
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
        --shadow-md: 0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 24px rgba(0, 0, 0, 0.28);
        --accent: #ffa05e;
        --hover: rgba(255, 255, 255, 0.06);
        --active: rgba(255, 255, 255, 0.1);
        --menu-bg: rgba(30, 33, 46, 0.86);
        --tip-bg: rgba(226, 231, 244, 0.95);
      }
      .chart-tip { color: #1c2333 !important; }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "SF Pro Text", "PingFang SC", "Segoe UI", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
      color: var(--ink);
      padding: 18px 22px 16px;
      -webkit-font-smoothing: antialiased;
      overflow: auto;
    }
    body.loading .stats .value { color: var(--faint); }
    body.loading .chart-card { opacity: 0.55; }

    /* ---------- 顶部筛选条 ---------- */
    .filters {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px 16px;
      gap: 14px;
      animation: fadeUp 0.4s cubic-bezier(0.22, 0.9, 0.36, 1) both;
    }
    .filters .left, .filters .right { display: flex; align-items: center; gap: 10px; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--ink);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: background-color 0.18s ease, transform 0.1s ease, opacity 0.18s ease;
    }
    .pill:hover { background: var(--hover); }
    .pill:active { transform: scale(0.97); }
    .pill:disabled { opacity: 0.55; cursor: default; }
    .pill svg { width: 12px; height: 12px; opacity: 0.55; }
    .pill #refreshIcon { width: 14px; height: 14px; }
    body.loading #refreshIcon { animation: spin 0.9s linear infinite; }

    /* 时间下拉菜单 */
    .time-menu {
      position: fixed;
      min-width: 140px;
      padding: 5px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--menu-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.18);
      z-index: 100;
    }
    .time-menu button {
      display: block;
      width: 100%;
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: var(--ink);
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
    }
    .time-menu button:hover { background: var(--hover); }
    .time-menu button.on { background: rgba(77, 107, 253, 0.10); color: #4d6bfd; font-weight: 600; }

    /* ---------- 统计大数字卡 ---------- */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }
    .stat {
      background: var(--card);
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: var(--shadow-md);
      opacity: 0;
      animation: fadeUp 0.45s cubic-bezier(0.22, 0.9, 0.36, 1) both;
    }
    .stat:nth-child(1) { animation-delay: 0.06s; }
    .stat:nth-child(2) { animation-delay: 0.12s; }
    .stat .label { font-size: 13px; color: var(--dim); margin-bottom: 8px; }
    .stat .value {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.5px;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      transition: color 0.2s ease;
    }
    .stat .hint { font-size: 12px; color: var(--faint); margin-top: 6px; }

    /* ---------- 主图卡片 ---------- */
    .chart-card {
      background: var(--card);
      border-radius: 16px;
      padding: 18px 20px 14px;
      box-shadow: var(--shadow-md);
      opacity: 0;
      animation: fadeUp 0.5s 0.22s cubic-bezier(0.22, 0.9, 0.36, 1) both;
      transition: opacity 0.2s ease;
    }
    .chart-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .chart-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
    }
    .chart-title .sub {
      color: var(--faint);
      font-weight: 500;
      margin-left: 8px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .seg-mini {
      display: inline-flex;
      background: var(--bg-2);
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
    }
    .seg-mini button {
      border: none;
      background: transparent;
      color: var(--dim);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      transition: background-color 0.18s ease, color 0.18s ease;
    }
    .seg-mini button.on {
      background: var(--card);
      color: var(--ink);
      box-shadow: var(--shadow-sm);
      font-weight: 600;
    }
    .seg-mini button:not(.on):hover { color: var(--ink); }

    .chart-svg-wrap {
      position: relative;
      height: 180px;
      margin: 0 -2px 8px;
    }
    .chart-svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .chart-hit { fill: transparent; cursor: default; }
    .chart-tip {
      position: absolute;
      z-index: 10;
      padding: 8px 12px;
      border-radius: 10px;
      background: var(--tip-bg);
      color: #ffffff;
      font-size: 12px;
      line-height: 1.6;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.28);
      transform: translate(-50%, -100%);
      opacity: 0;
      transition: opacity 0.12s ease;
      font-variant-numeric: tabular-nums;
    }
    .chart-tip.show { opacity: 1; }
    .chart-tip .t-date { opacity: 0.7; font-size: 11px; }
    .chart-tip .t-main { font-weight: 700; }
    .chart-tip .t-sub { opacity: 0.75; font-size: 11px; }
    .chart-bar {
      fill: var(--accent);
      opacity: 0;
      animation: barIn 0.55s cubic-bezier(0.22, 0.9, 0.36, 1) forwards;
    }
    .chart-axis {
      stroke: rgba(15, 23, 42, 0.12);
      stroke-width: 1;
      stroke-dasharray: 3 4;
    }
    @media (prefers-color-scheme: dark) {
      .chart-axis { stroke: rgba(255, 255, 255, 0.1); }
    }
    .chart-axis-label {
      fill: var(--faint);
      font-size: 11px;
      font-family: inherit;
      font-variant-numeric: tabular-nums;
    }
    .chart-x-labels {
      display: flex;
      justify-content: space-between;
      padding: 4px 14px 0;
      color: var(--faint);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .chart-empty {
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      color: var(--faint);
    }
    .chart-empty .whale { font-size: 38px; opacity: 0.6; }
    .chart-empty .tip { font-size: 13px; text-align: center; line-height: 1.6; }

    /* ---------- 通用 ---------- */
    .err { color: #d94747; font-size: 12px; padding: 6px 4px; min-height: 24px; }
    button:focus-visible { outline: 2px solid #4d6bfd; outline-offset: 2px; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes barIn {
      from { opacity: 0; transform: scaleY(0.6); transform-origin: bottom; }
      to { opacity: 1; transform: scaleY(1); transform-origin: bottom; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <!-- 顶部：时间下拉 + 刷新（用量永久记录，不提供删除） -->
  <div class="filters">
    <div class="left">
      <button class="pill" id="timePill" aria-haspopup="menu" aria-expanded="false">
        <span id="timeLabel">今天</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>
    <div class="right">
      <button class="pill" id="refreshBtn">
        <svg id="refreshIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        <span id="refreshLabel">刷新</span>
      </button>
    </div>
  </div>

  <!-- 2 张大数字 -->
  <div class="stats">
    <div class="stat">
      <div class="label">API requests</div>
      <div class="value" id="statRequests">—</div>
      <div class="hint" id="statRequestsHint">累计请求数</div>
    </div>
    <div class="stat">
      <div class="label">Tokens</div>
      <div class="value" id="statTokens">—</div>
      <div class="hint" id="statTokensHint">—</div>
    </div>
  </div>

  <!-- 主图（过去一个月连续展示；今天按小时） -->
  <div class="chart-card">
    <div class="chart-head">
      <div class="chart-title" id="chartTitle">今天 · Tokens<span class="sub" id="chartRange"></span></div>
      <div class="seg-mini" id="segMini">
        <button data-metric="tokens" class="on">Tokens</button>
        <button data-metric="requests">Requests</button>
      </div>
    </div>
    <div id="mainChart" class="chart-svg-wrap"></div>
    <div class="chart-x-labels" id="xLabels"></div>
  </div>

  <div class="err" id="err" role="alert"></div>

  <script>
    /* ========== 状态 ========== */
    let DATA = null
    let RANGE = 'today'        // 'today' | 'last7days' | 'last30days'
    let METRIC = 'tokens'      // 'tokens' | 'requests'
    let lastLoad = 0           // 供焦点自动刷新节流
    let loading = false

    const RANGE_LABEL = {
      today: '今天',
      last7days: '过去七天',
      last30days: '过去一个月',
    }

    /* ========== 工具 ========== */
    function fmtNum(n) {
      if (n === undefined || n === null) return '0'
      if (n < 1000) return String(Math.round(n))
      if (n < 10000) return (n / 1000).toFixed(2) + 'K'
      if (n < 1000000) return Math.round(n / 1000) + 'K'
      if (n < 10000000) return (n / 1000000).toFixed(2) + 'M'
      return (n / 1000000).toFixed(1) + 'M'
    }
    function fmtCount(n) {
      if (n === undefined || n === null) return '0'
      return String(Math.round(n))
    }
    function shortDay(ts) {
      const d = new Date(ts)
      return `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`
    }

    /* ========== Time 下拉 ========== */
    const timePill = document.getElementById('timePill')
    const timeLabel = document.getElementById('timeLabel')
    let openMenu = null
    function closeOpen() {
      if (openMenu && openMenu.parentNode) openMenu.parentNode.removeChild(openMenu)
      openMenu = null
      timePill.setAttribute('aria-expanded', 'false')
    }
    function showTimeMenu() {
      closeOpen()
      const r = timePill.getBoundingClientRect()
      const menu = document.createElement('div')
      menu.className = 'time-menu'
      menu.setAttribute('role', 'menu')
      menu.style.top = r.bottom + 6 + 'px'
      menu.style.left = r.left + 'px'
      const opts = [
        ['today', '今天'],
        ['last7days', '过去七天'],
        ['last30days', '过去一个月'],
      ]
      opts.forEach(([k, label]) => {
        const b = document.createElement('button')
        b.setAttribute('role', 'menuitem')
        b.textContent = label
        if (k === RANGE) b.classList.add('on')
        b.addEventListener('click', () => {
          RANGE = k
          timeLabel.textContent = label
          closeOpen()
          renderAll()
        })
        menu.appendChild(b)
      })
      document.body.appendChild(menu)
      const mw = menu.getBoundingClientRect()
      // 右侧溢出时右对齐到按钮
      const margin = 6
      if (r.left + mw.width > window.innerWidth - margin) {
        menu.style.left = Math.max(margin, window.innerWidth - mw.width - margin) + 'px'
      }
      openMenu = menu
      timePill.setAttribute('aria-expanded', 'true')
      const first = menu.querySelector('button')
      if (first) first.focus()
    }
    timePill.addEventListener('click', (e) => { e.stopPropagation(); openMenu ? closeOpen() : showTimeMenu() })
    document.addEventListener('click', (e) => { if (openMenu && !openMenu.contains(e.target)) closeOpen() })
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && openMenu) { closeOpen(); timePill.focus() }
    })
    // 下拉展开期间窗口尺寸变化 → 直接关闭（临时菜单，不值得重新定位）
    window.addEventListener('resize', closeOpen)

    /* ========== 主指标分段控件 ========== */
    document.getElementById('segMini').addEventListener('click', (ev) => {
      const btn = ev.target.closest('button')
      if (!btn) return
      METRIC = btn.dataset.metric
      document.querySelectorAll('#segMini button').forEach(b => b.classList.toggle('on', b === btn))
      renderChart()
    })

    /* ========== 当前窗口视图 ========== */
    function currentWindow() {
      return (DATA && DATA.windows && DATA.windows[RANGE]) || { ranges: [], total: { inputTokens: 0, outputTokens: 0, cacheReadTokens: 0, requests: 0 } }
    }

    function renderStats() {
      const win = currentWindow()
      const t = win.total || {}
      document.getElementById('statRequests').textContent = fmtCount(t.requests)
      document.getElementById('statRequestsHint').textContent = '累计请求数'
      const totalTok = (t.inputTokens || 0) + (t.outputTokens || 0) + (t.cacheReadTokens || 0)
      document.getElementById('statTokens').textContent = fmtNum(totalTok)
      document.getElementById('statTokensHint').textContent = '输入 ' + fmtNum(t.inputTokens) + ' · 输出 ' + fmtNum(t.outputTokens) + ' · 缓存 ' + fmtNum(t.cacheReadTokens)
    }

    /* ========== 主图（过去一个月连续展示；今天按小时） ========== */
    function bucketValue(b) {
      if (METRIC === 'requests') return b.requests || 0
      return (b.inputTokens || 0) + (b.outputTokens || 0) + (b.cacheReadTokens || 0)
    }
    function niceMax(v) {
      if (v <= 0) return 1
      const pow = Math.pow(10, Math.floor(Math.log10(v)))
      const n = v / pow
      let m
      if (n <= 1) m = 1
      else if (n <= 2) m = 2
      else if (n <= 5) m = 5
      else m = 10
      return m * pow
    }
    function getMainBuckets() {
      // 主图标固定画"过去一个月"（30 个日桶）；今天则按小时（24 桶）
      if (RANGE === 'today') {
        const w = (DATA && DATA.windows && DATA.windows.today) || { ranges: [] }
        return { buckets: w.ranges || [], kind: 'hour', source: 'today' }
      }
      // 过去七天 / 过去一个月 -> 都画过去 30 天
      const win30 = (DATA && DATA.windows && DATA.windows.last30days) || { ranges: [] }
      return { buckets: win30.ranges || [], kind: 'day', source: 'last30days' }
    }
    let LAST = { buckets: [], kind: 'day' }   // 供 tooltip 查询最近一次渲染的数据

    function renderChart() {
      const { buckets, kind } = getMainBuckets()
      const el = document.getElementById('mainChart')
      const xl = document.getElementById('xLabels')
      // 标题副文本
      const titleEl = document.getElementById('chartTitle')
      if (titleEl) {
        const metricLabel = METRIC === 'requests' ? 'Requests' : 'Tokens'
        const rangeLabel = RANGE_LABEL[RANGE]
        let sub = ''
        if (kind === 'hour') {
          sub = '（按小时，00:00 – 23:00）'
        } else {
          const first = buckets[0]?.start
          const last = buckets[buckets.length - 1]?.start
          if (first && last) sub = '（连续 30 天 · ' + shortDay(first) + ' – ' + shortDay(last) + '）'
        }
        titleEl.innerHTML = rangeLabel + ' · ' + metricLabel + '<span class="sub">' + sub + '</span>'
      }

      const has = buckets.some(b => bucketValue(b) > 0)
      // x 轴标签
      xl.innerHTML = ''
      if (!has) {
        LAST = { buckets: [], kind }
        el.innerHTML = '<div class="chart-empty"><div class="whale">🐋</div><div class="tip">暂无 API 调用记录。<br>开始对话后这里会显示用量。</div></div>'
        return
      }
      LAST = { buckets, kind }
      const max = buckets.reduce((m, b) => Math.max(m, bucketValue(b)), 0)
      const yMax = niceMax(max)
      const W = el.clientWidth || 540
      const H = 180
      const padL = 36, padR = 10, padT = 14, padB = 8
      const innerW = W - padL - padR
      const innerH = H - padT - padB
      const n = buckets.length
      const slot = innerW / n
      const barW = Math.max(2, Math.min(14, slot * 0.55))

      let svg = '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">'
      const ticks = [0, yMax * 0.25, yMax * 0.5, yMax * 0.75, yMax]
      ticks.forEach(t => {
        const y = padT + innerH - (t / yMax) * innerH
        svg += '<line class="chart-axis" x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '"/>'
        svg += '<text class="chart-axis-label" x="' + (padL - 6) + '" y="' + (y + 3) + '" text-anchor="end">' + fmtNum(t) + '</text>'
      })
      buckets.forEach((b, i) => {
        const v = bucketValue(b)
        const h = (v / yMax) * innerH
        const x = padL + i * slot + (slot - barW) / 2
        const y = padT + innerH - h
        const delay = (i * 12)
        svg += '<rect class="chart-bar" x="' + x.toFixed(2) + '" y="' + y.toFixed(2) + '" width="' + barW.toFixed(2) + '" height="' + Math.max(0.6, h).toFixed(2) + '" rx="2" ry="2" style="animation-delay:' + delay + 'ms"></rect>'
      })
      // 每列全高透明命中区：整列可悬停（比柱身宽，更容易命中）
      buckets.forEach((b, i) => {
        svg += '<rect class="chart-hit" data-i="' + i + '" x="' + (padL + i * slot).toFixed(2) + '" y="' + padT + '" width="' + slot.toFixed(2) + '" height="' + innerH + '"></rect>'
      })
      svg += '</svg>'
      el.innerHTML = '<div class="chart-tip" id="chartTip"></div>' + svg

      // X 轴标签：5 个等距位置
      const positions = [0, 0.25, 0.5, 0.75, 1]
      const labels = positions.map(p => {
        if (kind === 'hour') {
          if (p === 0) return '00:00'
          if (p === 1) return '23:00'
          return ''
        }
        const idx = Math.round(p * (buckets.length - 1))
        const b = buckets[idx]
        return b ? shortDay(b.start) : ''
      })
      xl.innerHTML = labels.map(l => '<span>' + l + '</span>').join('')
    }

    /* ========== 柱状图 hover 提示 ========== */
    (function bindChartTip() {
      const host = document.getElementById('mainChart')
      function hideTip() {
        const tip = document.getElementById('chartTip')
        if (tip) tip.classList.remove('show')
      }
      host.addEventListener('pointermove', (e) => {
        const hit = e.target && e.target.closest ? e.target.closest('.chart-hit') : null
        const tip = document.getElementById('chartTip')
        if (!hit || !tip) { hideTip(); return }
        const i = Number(hit.dataset.i)
        const b = LAST.buckets[i]
        if (!b) { hideTip(); return }
        const v = bucketValue(b)
        const dateLabel = LAST.kind === 'hour' ? (b.label || '') : shortDay(b.start)
        const main = METRIC === 'requests'
          ? fmtCount(v) + ' 次请求'
          : fmtNum(v) + ' tokens'
        let sub = ''
        if (METRIC === 'tokens') {
          sub = '<div class="t-sub">输入 ' + fmtNum(b.inputTokens) + ' · 输出 ' + fmtNum(b.outputTokens) + ' · 缓存 ' + fmtNum(b.cacheReadTokens) + '</div>'
        }
        tip.innerHTML = '<div class="t-date">' + dateLabel + '</div><div class="t-main">' + main + '</div>' + sub
        const hr = hit.getBoundingClientRect()
        const wr = host.getBoundingClientRect()
        let left = hr.left - wr.left + hr.width / 2
        left = Math.min(Math.max(left, 46), wr.width - 46)
        tip.style.left = left + 'px'
        tip.style.top = Math.max(hr.top - wr.top, 30) + 'px'
        tip.classList.add('show')
      })
      host.addEventListener('pointerleave', hideTip)
    })()

    function renderAll() {
      renderStats()
      renderChart()
    }

    function setLoading(on) {
      loading = on
      document.body.classList.toggle('loading', on)
      const btn = document.getElementById('refreshBtn')
      btn.disabled = on
      document.getElementById('refreshLabel').textContent = on ? '刷新中…' : '刷新'
    }

    /* ========== 数据加载 ========== */
    async function load({ silent = false } = {}) {
      if (loading) return
      const errEl = document.getElementById('err')
      try {
        if (!window.desktop) throw new Error('桌面桥不可用')
        if (!silent) setLoading(true)
        const d = await window.desktop.usage()
        DATA = d
        // 主进程快照/聚合失败时也会返回 error 字段：不能把失败渲染成 0
        errEl.textContent = (d && d.error) ? '读取用量失败：' + d.error : ''
        if (!d || !d.error) lastLoad = Date.now()
        renderAll()
      } catch (e) {
        errEl.textContent = '读取用量失败：' + e.message
      } finally {
        setLoading(false)
      }
    }
    document.getElementById('refreshBtn').addEventListener('click', () => load())

    // 窗口重获焦点时静默刷新（节流 15s，聊天中切过来看一眼就是最新数据）
    window.addEventListener('focus', () => {
      if (Date.now() - lastLoad > 15000) load({ silent: true })
    })

    load()
  </script>
</body>
</html>
